<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Executor Editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #121212;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            background: #121212;
        }


        /* ========================================
           TOP BAR
        ======================================== */

        .topbar {
            width: 100%;
            height: 50px;
            min-height: 50px;

            display: flex;
            align-items: stretch;

            background: #121212;

            border-bottom: 1px solid #242424;
        }


        /* ========================================
           TABS CONTAINER
        ======================================== */

        #tabs {
            height: 50px;

            display: flex;
            align-items: stretch;

            overflow-x: auto;
            overflow-y: hidden;

            scrollbar-width: none;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }


        /* ========================================
           TAB
        ======================================== */

        .tab {
            height: 50px;

            min-width: 210px;
            max-width: 280px;

            display: flex;
            align-items: center;

            gap: 11px;

            padding: 0 16px;

            color: #e8e8eb;

            font-size: 16px;

            background: #121212;

            border-right: 1px solid #242424;

            border-top: 2px solid transparent;

            user-select: none;

            cursor: pointer;

            transition:
                background 0.12s ease,
                border-color 0.12s ease;
        }

        .tab:hover {
            background: #171717;
        }

        .tab.active {
            background: #151515;

            border-top-color: #777bff;
        }


        /* ========================================
           FILE ICON
        ======================================== */

        .file-icon {
            width: 18px;
            height: 22px;

            flex-shrink: 0;

            position: relative;

            border: 2px solid #ededf0;

            border-radius: 3px;
        }

        .file-icon::before {
            content: "";

            position: absolute;

            top: -2px;
            right: -2px;

            width: 7px;
            height: 7px;

            background: #151515;

            border-left: 2px solid #ededf0;
            border-bottom: 2px solid #ededf0;
        }


        /* ========================================
           TAB TITLE
        ======================================== */

        .tab-title {
            min-width: 0;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* ========================================
           DIRTY INDICATOR
        ======================================== */

        .dirty {
            color: #dedee2;

            font-size: 13px;

            margin-left: 2px;
        }


        /* ========================================
           CLOSE BUTTON
        ======================================== */

        .close {
            margin-left: auto;

            flex-shrink: 0;

            width: 24px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #77777e;

            font-size: 21px;

            line-height: 1;

            border-radius: 4px;

            cursor: pointer;

            transition:
                color 0.12s ease,
                background 0.12s ease;
        }

        .close:hover {
            color: #ffffff;

            background: #303030;
        }


        /* ========================================
           NEW TAB BUTTON
        ======================================== */

        .new-tab {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #85858b;

            font-size: 27px;

            cursor: pointer;

            user-select: none;

            transition:
                color 0.12s ease,
                background 0.12s ease;
        }

        .new-tab:hover {
            color: #eeeeee;

            background: #171717;
        }


        /* ========================================
           MONACO EDITOR
        ======================================== */

        #editor {
            flex: 1;

            width: 100%;
            min-height: 0;

            background: #121212;
        }


        /* ========================================
           MONACO SCROLLBARS
        ======================================== */

        .monaco-editor .scrollbar.vertical {
            width: 10px !important;
        }

        .monaco-editor .scrollbar.horizontal {
            height: 10px !important;
        }

    </style>
</head>


<body>

<div id="app">

    <!-- TOP BAR -->

    <div class="topbar">

        <div id="tabs"></div>

        <div
            class="new-tab"
            id="newTab"
            title="New Tab"
        >
            +
        </div>

    </div>


    <!-- EDITOR -->

    <div id="editor"></div>

</div>


<!-- ============================================
     MONACO LOADER
============================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>


<script>

    require.config({

        paths: {

            vs:
                "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"

        }

    });


    require(
        ["vs/editor/editor.main"],
        function () {


            /* ====================================
               CUSTOM DARK THEME
            ==================================== */

            monaco.editor.defineTheme(
                "ExecutorDark",
                {

                    base: "vs-dark",

                    inherit: true,

                    rules: [

                        {
                            token: "comment",
                            foreground: "6A6A72"
                        },

                        {
                            token: "keyword",
                            foreground: "C586C0"
                        },

                        {
                            token: "string",
                            foreground: "CE9178"
                        },

                        {
                            token: "number",
                            foreground: "B5CEA8"
                        },

                        {
                            token: "type",
                            foreground: "4EC9B0"
                        },

                        {
                            token: "identifier",
                            foreground: "D4D4D4"
                        }

                    ],


                    colors: {

                        /* EXACT RGB 18,18,18 */

                        "editor.background":
                            "#121212",

                        "editor.foreground":
                            "#D4D4D8",


                        /* Line numbers */

                        "editorLineNumber.foreground":
                            "#777777",

                        "editorLineNumber.activeForeground":
                            "#CFCFD5",


                        /* Current line */

                        "editor.lineHighlightBackground":
                            "#181818",


                        /* Selection */

                        "editor.selectionBackground":
                            "#30305A",

                        "editor.inactiveSelectionBackground":
                            "#29294A",


                        /* Cursor */

                        "editorCursor.foreground":
                            "#FFFFFF",


                        /* Gutter */

                        "editorGutter.background":
                            "#121212",


                        /* Suggestions */

                        "editorSuggestWidget.background":
                            "#181818",

                        "editorSuggestWidget.border":
                            "#303030",

                        "editorSuggestWidget.selectedBackground":
                            "#292929",


                        /* Scrollbar */

                        "scrollbarSlider.background":
                            "#45454588",

                        "scrollbarSlider.hoverBackground":
                            "#55555599",

                        "scrollbarSlider.activeBackground":
                            "#666666AA"

                    }

                }
            );


            /* ====================================
               CREATE MONACO EDITOR
            ==================================== */

            const editor =
                monaco.editor.create(
                    document.getElementById("editor"),
                    {

                        value: "",

                        language: "lua",

                        theme: "ExecutorDark",


                        automaticLayout: true,


                        /* Disable minimap */

                        minimap: {

                            enabled: false

                        },


                        /* Font */

                        fontFamily:
                            "'Cascadia Code', 'Consolas', monospace",

                        fontSize: 15,

                        lineHeight: 22,

                        fontLigatures: true,


                        /* Cursor */

                        cursorBlinking: "smooth",

                        cursorSmoothCaretAnimation:
                            "on",


                        /* Rendering */

                        smoothScrolling: true,

                        renderWhitespace: "selection",

                        renderLineHighlight: "line",

                        roundedSelection: false,


                        /* Scrolling */

                        scrollBeyondLastLine: false,

                        wordWrap: "off",


                        /* Folding */

                        folding: true,

                        foldingHighlight: true,

                        showFoldingControls:
                            "mouseover",


                        /* Line numbers */

                        lineNumbers: "on",

                        lineNumbersMinChars: 3,

                        glyphMargin: false,


                        /* Overview */

                        overviewRulerBorder: false,

                        hideCursorInOverviewRuler:
                            true,


                        /* Context menu */

                        contextmenu: true,


                        /* Mouse wheel zoom */

                        mouseWheelZoom: true,


                        /* Indentation */

                        tabSize: 4,

                        insertSpaces: true,


                        /* Padding */

                        padding: {

                            top: 0,

                            bottom: 20

                        }

                    }
                );


            /* ====================================
               TAB SYSTEM
            ==================================== */

            const tabsContainer =
                document.getElementById("tabs");

            const newTabButton =
                document.getElementById("newTab");


            let tabs = [];

            let activeTabId = null;

            let nextTabNumber = 1;


            /* ====================================
               CREATE TAB
            ==================================== */

            function createTab() {

                const id =
                    Date.now() +
                    Math.random();


                const name =
                    `Untitled ${nextTabNumber}`;


                nextTabNumber++;


                /*
                 * Every tab has its own
                 * Monaco model.
                 */

                const model =
                    monaco.editor.createModel(
                        "",
                        "lua"
                    );


                const tab = {

                    id: id,

                    name: name,

                    model: model

                };


                tabs.push(tab);


                switchTab(id);

            }


            /* ====================================
               SWITCH TAB
            ==================================== */

            function switchTab(id) {

                const tab =
                    tabs.find(
                        function (item) {

                            return item.id === id;

                        }
                    );


                if (!tab)
                    return;


                activeTabId = id;


                /*
                 * Give Monaco the tab's model.
                 */

                editor.setModel(
                    tab.model
                );


                editor.focus();


                renderTabs();

            }


            /* ====================================
               CLOSE TAB
            ==================================== */

            function closeTab(id) {

                /*
                 * Don't allow the final tab
                 * to be closed.
                 */

                if (tabs.length <= 1) {

                    return;

                }


                const index =
                    tabs.findIndex(
                        function (item) {

                            return item.id === id;

                        }
                    );


                if (index === -1)
                    return;


                const tab =
                    tabs[index];


                /*
                 * Dispose the Monaco model.
                 */

                tab.model.dispose();


                /*
                 * Remove the tab.
                 */

                tabs.splice(index, 1);


                /*
                 * If the active tab was closed,
                 * select a nearby tab.
                 */

                if (activeTabId === id) {

                    const newIndex =
                        Math.min(
                            index,
                            tabs.length - 1
                        );


                    activeTabId =
                        tabs[newIndex].id;


                    editor.setModel(
                        tabs[newIndex].model
                    );

                }


                renderTabs();

                editor.focus();

            }


            /* ====================================
               RENDER TABS
            ==================================== */

            function renderTabs() {

                tabsContainer.innerHTML = "";


                tabs.forEach(
                    function (tab) {


                        /* Tab */

                        const tabElement =
                            document.createElement(
                                "div"
                            );


                        tabElement.className =
                            "tab";


                        if (
                            tab.id ===
                            activeTabId
                        ) {

                            tabElement.classList.add(
                                "active"
                            );

                        }


                        /* File icon */

                        const icon =
                            document.createElement(
                                "div"
                            );

                        icon.className =
                            "file-icon";


                        /* Title */

                        const title =
                            document.createElement(
                                "span"
                            );

                        title.className =
                            "tab-title";

                        title.textContent =
                            tab.name;


                        /* Dirty indicator */

                        const dirty =
                            document.createElement(
                                "span"
                            );

                        dirty.className =
                            "dirty";

                        dirty.textContent =
                            "•";


                        /* Close button */

                        const close =
                            document.createElement(
                                "span"
                            );

                        close.className =
                            "close";


                        /*
                         * Only show X if there
                         * are multiple tabs.
                         */

                        if (tabs.length > 1) {

                            close.textContent =
                                "×";

                            close.title =
                                "Close";


                            close.addEventListener(
                                "click",
                                function (event) {

                                    event.stopPropagation();

                                    closeTab(
                                        tab.id
                                    );

                                }
                            );

                        }
                        else {

                            /*
                             * Hide X when there
                             * is only one tab.
                             */

                            close.style.visibility =
                                "hidden";

                        }


                        /* Build tab */

                        tabElement.appendChild(
                            icon
                        );

                        tabElement.appendChild(
                            title
                        );

                        tabElement.appendChild(
                            dirty
                        );

                        tabElement.appendChild(
                            close
                        );


                        /* Switch tab */

                        tabElement.addEventListener(
                            "click",
                            function () {

                                switchTab(
                                    tab.id
                                );

                            }
                        );


                        tabsContainer.appendChild(
                            tabElement
                        );

                    }
                );

            }


            /* ====================================
               + NEW TAB
            ==================================== */

            newTabButton.addEventListener(
                "click",
                function () {

                    createTab();

                }
            );


            /* ====================================
               CTRL + S
            ==================================== */

            editor.addCommand(

                monaco.KeyMod.CtrlCmd |
                monaco.KeyCode.KeyS,

                function () {

                    const activeTab =
                        tabs.find(
                            function (tab) {

                                return (
                                    tab.id ===
                                    activeTabId
                                );

                            }
                        );


                    if (!activeTab)
                        return;


                    console.log(
                        "Saved:",
                        activeTab.model.getValue()
                    );

                }

            );


            /* ====================================
               START WITH ONE TAB
            ==================================== */

            createTab();

        }
    );

</script>

</body>
</html>
